name: Repository setup and desktop builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-tests:
    name: Setup regression tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # POSIX (Linux / macOS) safe.directory
      - name: Mark workspace safe for Git (POSIX)
        if: runner.os != 'Windows'
        run: |
          TARGET="${GITHUB_WORKSPACE:-$(pwd)}"
          echo "Marking git safe.directory for: $TARGET"
          git config --global --add safe.directory "$TARGET" || true
          if [ "$(id -u)" = "0" ]; then
            git config --system --add safe.directory "$TARGET" || true
          fi
          echo "git safe.directory entries:"
          git config --get-all safe.directory || true
          echo "git config (first lines):"
          git config --list --show-origin | sed -n '1,120p' || true

      # Windows safe.directory (PowerShell)
      - name: Mark workspace safe for Git (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = $Env:GITHUB_WORKSPACE
          if (-not $target) { $target = (Get-Location).Path }
          Write-Host "Marking git safe.directory for: $target"
          git config --global --add safe.directory $target
          try {
            git config --system --add safe.directory $target
          } catch {
            Write-Host "git config --system failed (expected on non-admin): $_"
          }
          Write-Host "git safe.directory entries:"
          git config --get-all safe.directory | ForEach-Object { Write-Host $_ }
          Write-Host "git config (first lines):"
          git config --list --show-origin | Select-Object -First 120 | ForEach-Object { Write-Host $_ }

      - name: Quick Python syntax check
        run: python -m py_compile tools/setup_repo.py

      - name: Validate tracked paths, submodule mappings and patch pins
        run: python tools/setup_repo.py --check-metadata
      - name: Exercise clone, pull, migration and recovery with local test remotes
        run: python tools/test_setup_repo.py

  desktop:
    name: Clean dependencies and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: linux-debug
          - os: windows-2022
            preset: x64-Clang-Debug
          - os: macos-26
            preset: macos-debug
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Mark workspace safe for Git (POSIX)
        if: runner.os != 'Windows'
        run: |
          TARGET="${GITHUB_WORKSPACE:-$(pwd)}"
          echo "Marking git safe.directory for: $TARGET"
          git config --global --add safe.directory "$TARGET" || true
          if [ "$(id -u)" = "0" ]; then
            git config --system --add safe.directory "$TARGET" || true
          fi
          echo "git safe.directory entries:"
          git config --get-all safe.directory || true
          echo "git config (first lines):"
          git config --list --show-origin | sed -n '1,120p' || true

      - name: Mark workspace safe for Git (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = $Env:GITHUB_WORKSPACE
          if (-not $target) { $target = (Get-Location).Path }
          Write-Host "Marking git safe.directory for: $target"
          git config --global --add safe.directory $target
          try {
            git config --system --add safe.directory $target
          } catch {
            Write-Host "git config --system failed (expected on non-admin): $_"
          }
          Write-Host "git safe.directory entries:"
          git config --get-all safe.directory | ForEach-Object { Write-Host $_ }
          Write-Host "git config (first lines):"
          git config --list --show-origin | Select-Object -First 120 | ForEach-Object { Write-Host $_ }

      - name: Quick Python syntax check
        run: python -m py_compile tools/setup_repo.py

      - name: Install current CMake and Ninja
        run: python -m pip install 'cmake>=3.29,<5' ninja
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 build-essential pkg-config curl zip unzip \
            autoconf automake libtool libgtk-3-dev libx11-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxext-dev libxkbcommon-dev libwayland-dev \
            libxss-dev wayland-protocols libdecor-0-dev libasound2-dev libpulse-dev libdbus-1-dev \
            libusb-1.0-0-dev libssl-dev libvulkan-dev nasm
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
      - name: Install macOS prerequisites
        if: runner.os == 'macOS'
        run: brew install llvm pkg-config openssl@3 vulkan-loader
      - name: Select the Windows C++ development environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Initialize every public dependency and apply reviewed patches
        run: python tools/setup_repo.py
      - name: Verify repeatable setup and patch preparation
        run: |
          python tools/setup_repo.py
          python tools/setup_repo.py --check
          python tools/test_dependency_patches.py

      - name: Ensure compatibility module for legacy FindPythonInterp
        run: |
          mkdir -p cmake/Modules
          cat > cmake/Modules/FindPythonInterp.cmake <<'EOF'
          # Compatibility wrapper for legacy FindPythonInterp
          find_package(Python3 COMPONENTS Interpreter QUIET)
          if(Python3_Interpreter_FOUND)
            set(PYTHON_EXECUTABLE ${Python3_EXECUTABLE} CACHE FILEPATH "Path to Python3 executable" FORCE)
            set(PythonInterp_FOUND TRUE)
          else()
            find_package(Python COMPONENTS Interpreter QUIET)
            if(Python_Interpreter_FOUND)
              set(PYTHON_EXECUTABLE ${PYTHON_EXECUTABLE} CACHE FILEPATH "Path to Python executable" FORCE)
              set(PythonInterp_FOUND TRUE)
            else()
              find_program(PYTHON_EXECUTABLE NAMES python3 python python2)
              if(PYTHON_EXECUTABLE)
                set(PythonInterp_FOUND TRUE)
              else()
                set(PythonInterp_FOUND FALSE)
              endif()
            endif()
          endif()
          EOF
      - name: Configure desktop
        if: runner.os != 'macOS'
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_MODULE_PATH="${{ github.workspace }}/cmake/Modules"
      - name: Configure native macOS architecture
        if: runner.os == 'macOS'
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_MODULE_PATH="${{ github.workspace }}/cmake/Modules" -DCMAKE_OSX_ARCHITECTURES="$(uname -m)"
      - name: Build application from checked-in generated sources
        run: cmake --build --preset ${{ matrix.preset }} --target LibertyRecomp --parallel 2

  arch:
    name: Arch Linux with distro CMake 4 and uncached vcpkg
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 180
    steps:
      - name: Install Arch prerequisites
        run: |
          pacman -Syu --noconfirm --needed git python cmake ninja clang lld pkgconf curl zip unzip \
            autoconf automake libtool gtk3 libx11 libxrandr libxcursor libxi libxinerama libxext \
            libxkbcommon wayland wayland-protocols libdecor alsa-lib libpulse dbus libusb \
            libxss openssl vulkan-icd-loader vulkan-headers nasm

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Mark workspace safe for Git (POSIX)
        if: runner.os != 'Windows'
        run: |
          TARGET="${GITHUB_WORKSPACE:-$(pwd)}"
          echo "Marking git safe.directory for: $TARGET"
          git config --global --add safe.directory "$TARGET" || true
          if [ "$(id -u)" = "0" ]; then
            git config --system --add safe.directory "$TARGET" || true
          fi
          echo "git safe.directory entries:"
          git config --get-all safe.directory || true
          echo "git config (first lines):"
          git config --list --show-origin | sed -n '1,120p' || true

      - name: Quick Python syntax check
        run: python -m py_compile tools/setup_repo.py

      - name: Initialize and validate all dependency sources
        run: |
          python tools/setup_repo.py
          python tools/setup_repo.py --check
          cmake --version

      - name: Ensure compatibility module for legacy FindPythonInterp
        run: |
          mkdir -p cmake/Modules
          cat > cmake/Modules/FindPythonInterp.cmake <<'EOF'
          # Compatibility wrapper for legacy FindPythonInterp
          find_package(Python3 COMPONENTS Interpreter QUIET)
          if(Python3_Interpreter_FOUND)
            set(PYTHON_EXECUTABLE ${Python3_EXECUTABLE} CACHE FILEPATH "Path to Python3 executable" FORCE)
            set(PythonInterp_FOUND TRUE)
          else()
            find_package(Python COMPONENTS Interpreter QUIET)
            if(Python_Interpreter_FOUND)
              set(PYTHON_EXECUTABLE ${PYTHON_EXECUTABLE} CACHE FILEPATH "Path to Python executable" FORCE)
              set(PythonInterp_FOUND TRUE)
            else()
              find_program(PYTHON_EXECUTABLE NAMES python3 python python2)
              if(PYTHON_EXECUTABLE)
                set(PythonInterp_FOUND TRUE)
              else()
                set(PythonInterp_FOUND FALSE)
              endif()
            endif()
          endif()
          EOF

      - name: Configure with the system CMake and build
        env:
          VCPKG_BINARY_SOURCES: clear
        run: |
          cmake --preset linux-release -DCMAKE_MODULE_PATH="${{ github.workspace }}/cmake/Modules"
          cmake --build --preset linux-release --target LibertyRecomp --parallel 2
